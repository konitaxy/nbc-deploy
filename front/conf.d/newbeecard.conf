server {
    listen 443 ssl;
    server_name newbeecard.com;
    include conf.d/options-ssl.conf;

    root /nbc/console;
    client_max_body_size 64M;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* ^/[^/]+/assets/(.*)$ {
        rewrite ^/[^/]+/assets/(.*)$ /assets/$1 last;
    }
    location ~* ^/[^/]+/js/(.*)$ {
        rewrite ^/[^/]+/js/(.*)$ /js/$1 last;
    }

    location /api/ {
        if ($http_user_agent = Mozilla/4.0) {
            return 503;
        }
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-NginX-Proxy true;
        rewrite ^/api(/.*)$ $1 break;
        proxy_redirect off;
        proxy_pass http://nbc_backend;
    }
}

server {
    if ($host = newbeecard.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name newbeecard.com;
    return 404;
}
