server {
    listen 443 ssl;
    server_name newbeecard.com;
    include conf.d/options-ssl-nbc.conf;

    root /nbc/console;
    client_max_body_size 64M;
    index index.html index.htm;

    location /.well-known/acme-challenge/ {
        root /nbc/console;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* ^/[^/]+/assets/(.*)$ {
        rewrite ^/[^/]+/assets/(.*)$ /assets/$1 last;
    }
    location ~* ^/[^/]+/js/(.*)$ {
        rewrite ^/[^/]+/js/(.*)$ /js/$1 last;
    }

    location /api/ {
        if ($http_user_agent = Mozilla/4.0) {
            return 503;
        }
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-NginX-Proxy true;
        rewrite ^/api(/.*)$ $1 break;
        proxy_redirect off;
        proxy_pass http://nbc_backend;
    }
}

server {
    listen 80;
    server_name newbeecard.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        # 注意：这个路径必须与后续 Docker 挂载的宿主机路径一致
        root /nbc/console; 
    }

    # gzy webhook：HTTP 直连后端，不走 HTTPS 跳转
    location = /api/admin/gzy/hook {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-NginX-Proxy true;
        rewrite ^/api(/.*)$ $1 break;
        proxy_redirect off;
        proxy_pass http://nbc_backend;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
